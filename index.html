<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý nhân viên</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}
header{background:#1769e0;color:white;padding:18px}
header h1{margin:0;font-size:22px}
.container{max-width:1200px;margin:auto;padding:15px}
.card{background:white;border-radius:15px;padding:16px;margin-bottom:16px;box-shadow:0 3px 15px #0001}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:16px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;font-size:14px;cursor:pointer}
.primary{background:#1769e0;color:white}
.danger{background:#e53935;color:white}
.gray{background:#edf1f5}
.hidden{display:none}
.center{text-align:center}
.error{color:#d32f2f;margin-top:10px}
.success{color:#16823b;margin-top:10px}
.schedule{overflow-x:auto}
table{width:100%;min-width:900px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:7px;text-align:center}
th{background:#f1f4f8}
.shift{min-height:90px;border-radius:10px;padding:9px}
.free{background:#e8f4ff;border:1px solid #abd1ff;cursor:pointer}
.wait{background:#fff5d9}
.ok{background:#e3f7e8}
.full{background:#eee;color:#777}
.shift strong{display:block;font-size:16px}
.shift small{display:block;margin:5px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;font-size:12px}
.request{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}
</style>
</head>

<body>

<header>
<h1>📅 QUẢN LÝ NHÂN VIÊN</h1>
<div>Đăng ký ca làm việc</div>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
<h2>🔐 Đăng nhập</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Mật khẩu">

<button class="primary" onclick="login()">Đăng nhập</button>

<div id="loginMessage"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="card">
<div class="top">
<div>
<b id="userName"></b>
<br>
<span id="userRole" class="badge"></span>
</div>

<button class="gray" onclick="logout()">Đăng xuất</button>
</div>
</div>

<!-- LỊCH -->
<div class="card">

<div class="top">

<button class="gray" onclick="changeWeek(-1)">
← Tuần trước
</button>

<b id="weekTitle"></b>

<button class="gray" onclick="changeWeek(1)">
Tuần sau →
</button>

</div>

<br>

<div class="schedule">
<table>

<thead>
<tr>
<th>Ca</th>
<th>Thứ 2</th>
<th>Thứ 3</th>
<th>Thứ 4</th>
<th>Thứ 5</th>
<th>Thứ 6</th>
<th>Thứ 7</th>
<th>CN</th>
</tr>
</thead>

<tbody id="scheduleBody"></tbody>

</table>
</div>

</div>

<!-- ADMIN -->
<div id="adminPanel" class="card hidden">

<h2>👨‍💼 Quản trị Admin</h2>

<div id="requests"></div>

</div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://xbpaaujqutnarezfkcrp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qvaULo72eeaShRmD5KcGEw_4ZpE-wFk";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let employee=null;
let weekOffset=0;
let shifts=[];
let registrations=[];


/* ================= LOGIN ================= */

async function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

const msg=
document.getElementById("loginMessage");

if(!email||!password){

msg.className="error";
msg.textContent="Vui lòng nhập email và mật khẩu.";
return;
}

msg.textContent="Đang đăng nhập...";

const {data,error}=
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

msg.className="error";
msg.textContent=error.message;
return;
}

currentUser=data.user;

await loadUser();

}


/* ================= USER ================= */

async function loadUser(){

const {data,error}=
await supabaseClient
.from("nhan_vien")
.select("*")
.eq("id",currentUser.id)
.single();

if(error||!data){

await supabaseClient.auth.signOut();

document.getElementById("loginMessage").className="error";
document.getElementById("loginMessage").textContent=
"Tài khoản chưa được tạo trong hệ thống.";

return;
}

if(!data.trang_thai){

await supabaseClient.auth.signOut();

document.getElementById("loginMessage").className="error";
document.getElementById("loginMessage").textContent=
"Tài khoản đang bị khóa.";

return;
}

employee=data;

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("userName")
.textContent="👤 "+data.ho_ten;

document.getElementById("userRole")
.textContent=
data.vai_tro==="admin"
?"👨‍💼 ADMIN"
:"👤 NHÂN VIÊN";

if(data.vai_tro==="admin"){
document.getElementById("adminPanel")
.classList.remove("hidden");
}

await loadData();

}


/* ================= DATA ================= */

async function loadData(){

const shiftResult=
await supabaseClient
.from("ca_lam")
.select("*")
.order("thu")
.order("ca");

if(shiftResult.error){
alert(shiftResult.error.message);
return;
}

shifts=shiftResult.data||[];

const monday=getMonday();

const sunday=new Date(monday);
sunday.setDate(sunday.getDate()+6);

const {data,error}=
await supabaseClient
.from("dang_ky_ca")
.select(`
id,
nhan_vien_id,
ca_lam_id,
ngay,
trang_thai,
nhan_vien(ho_ten),
ca_lam(ca,gio_bat_dau,gio_ket_thuc)
`)
.gte("ngay",dateString(monday))
.lte("ngay",dateString(sunday));

if(error){
alert(error.message);
return;
}

registrations=data||[];

renderSchedule();

if(employee.vai_tro==="admin"){
renderRequests();
}

}


/* ================= DATE ================= */

function getMonday(){

const d=new Date();

const day=d.getDay();

const diff=
day===0
?-6
:1-day;

d.setDate(
d.getDate()+diff+weekOffset*7
);

d.setHours(0,0,0,0);

return d;

}

function dateString(d){

return d.toISOString().split("T")[0];

}

function dateVN(d){

return d.toLocaleDateString(
"vi-VN",
{
day:"2-digit",
month:"2-digit"
}
);

}


/* ================= LỊCH ================= */

function renderSchedule(){

const monday=getMonday();

const sunday=new Date(monday);

sunday.setDate(sunday.getDate()+6);

document.getElementById("weekTitle").textContent=
dateVN(monday)+" - "+dateVN(sunday);

let html="";

["C1","C2","C3"].forEach(ca=>{

const sample=shifts.find(x=>x.ca===ca);

html+="<tr>";

html+=`
<td>
<b>${ca}</b><br>
<small>
${sample?sample.gio_bat_dau:""} -
${sample?sample.gio_ket_thuc:""}
</small>
</td>
`;

for(let i=0;i<7;i++){

const d=new Date(monday);
d.setDate(d.getDate()+i);

const dayNumber=i+2;

const shift=shifts.find(
x=>x.thu===dayNumber&&x.ca===ca
);

if(!shift){

html+="<td>---</td>";
continue;

}

const registration=
registrations.find(
r=>
r.ca_lam_id===shift.id &&
r.ngay===dateString(d)
);

if(registration){

let cls="wait";
let text="🟡 Chờ duyệt";

if(registration.trang_thai==="da_duyet"){
cls="ok";
text="✅ Đã duyệt";
}

if(registration.trang_thai==="tu_choi"){
cls="full";
text="❌ Từ chối";
}

html+=`
<td>
<div class="shift ${cls}">
<strong>${ca}</strong>
<small>
${shift.gio_bat_dau} -
${shift.gio_ket_thuc}
</small>
👤 ${registration.nhan_vien?.ho_ten||"Nhân viên"}
<br>
<small>${text}</small>
</div>
</td>
`;

}else{

html+=`
<td>
<div
class="shift free"
onclick="registerShift(
${shift.id},
'${dateString(d)}',
'${ca}',
'${shift.gio_bat_dau}-${shift.gio_ket_thuc}'
)"
>
<strong>${ca}</strong>
<small>
${shift.gio_bat_dau} -
${shift.gio_ket_thuc}
</small>
🟢 Đăng ký
</div>
</td>
`;

}

}

html+="</tr>";

});

document.getElementById("scheduleBody").innerHTML=html;

}


/* ================= ĐĂNG KÝ ================= */

async function registerShift(
shiftId,
date,
ca,
time
){

const ok=confirm(
"Đăng ký "+ca+
" ngày "+date+
" ("+time+")?"
);

if(!ok)return;

const {error}=
await supabaseClient
.from("dang_ky_ca")
.insert({

nhan_vien_id:currentUser.id,
ca_lam_id:shiftId,
ngay:date,
trang_thai:"cho_duyet"

});

if(error){

if(error.code==="23505"){
alert("❌ Ca này đã có người đăng ký.");
}else{
alert(error.message);
}

return;
}

alert("✅ Đăng ký thành công. Đang chờ Admin duyệt.");

await loadData();

}


/* ================= ADMIN ================= */

function renderRequests(){

const box=
document.getElementById("requests");

if(!registrations.length){

box.innerHTML=
"<p>Chưa có đăng ký trong tuần này.</p>";

return;

}

box.innerHTML=
registrations.map(r=>{

let status=
r.trang_thai==="da_duyet"
?"✅ Đã duyệt":
r.trang_thai==="tu_choi"
?"❌ Từ chối":
"🟡 Chờ duyệt";

return `
<div class="request">

<b>👤 ${r.nhan_vien?.ho_ten||""}</b>

<br>
📅 ${r.ngay}

<br>
🕐 ${r.ca_lam?.ca||""}
${r.ca_lam?.gio_bat_dau||""} -
${r.ca_lam?.gio_ket_thuc||""}

<br><br>

${status}

<br><br>

${
r.trang_thai==="cho_duyet"
?
`
<button
class="primary"
onclick="approve(${r.id})"
>
✅ Duyệt
</button>

<button
class="danger"
onclick="reject(${r.id})"
>
❌ Từ chối
</button>
`
:""
}

</div>
`;

}).join("");

}


/* ================= DUYỆT ================= */

async function approve(id){

const {error}=
await supabaseClient
.from("dang_ky_ca")
.update({
trang_thai:"da_duyet"
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

await loadData();

}


/* ================= TỪ CHỐI ================= */

async function reject(id){

const {error}=
await supabaseClient
.from("dang_ky_ca")
.update({
trang_thai:"tu_choi"
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

await loadData();

}


/* ================= TUẦN ================= */

function changeWeek(value){

weekOffset+=value;

loadData();

}


/* ================= LOGOUT ================= */

async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* ================= SESSION ================= */

async function checkSession(){

const {data}=
await supabaseClient.auth.getSession();

if(data.session){

currentUser=data.session.user;

await loadUser();

}

}

checkSession();

</script>

</body>
</html>
