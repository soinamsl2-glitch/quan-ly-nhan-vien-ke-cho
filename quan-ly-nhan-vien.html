<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý nhân viên</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#2563eb;color:white;padding:18px}header h1{margin:0;font-size:23px}header p{margin:6px 0 0}
main{max-width:1100px;margin:auto;padding:14px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #0000000b}
.login{max-width:430px;margin:35px auto}input{width:100%;padding:13px;margin:6px 0 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.light{background:#eef2f7;color:#172033}
.hidden{display:none}.error{color:#dc2626;margin-top:10px}.muted{color:#64748b;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:4px 8px;border-radius:99px;font-size:12px;font-weight:bold}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}
.table{overflow:auto}table{width:100%;min-width:850px;border-collapse:separate;border-spacing:5px}th{font-size:13px;color:#475569}td{vertical-align:top}
.shift{min-height:105px;padding:9px;border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc}.free{background:#eff6ff;border-color:#bfdbfe}.mine{background:#fffbeb;border-color:#fde68a}.ok{background:#f0fdf4;border-color:#bbf7d0}
.shift .time{font-size:12px;color:#64748b;margin:5px 0}.shift button{width:100%;margin-top:7px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.item{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:7px 0}
@media(max-width:600px){main{padding:9px}.card{padding:13px}}
</style>
</head>
<body>
<header><h1>📅 QUẢN LÝ NHÂN VIÊN</h1><p>Đăng ký ca làm việc</p></header>
<main>
<section id="loginScreen" class="card login">
<h2>🔐 Đăng nhập</h2>
<label>Tài khoản</label><input id="u" placeholder="Tài khoản">
<label>Mật khẩu</label><input id="p" type="password" placeholder="Mật khẩu">
<button class="primary" style="width:100%" onclick="login()">Đăng nhập</button>
<div id="err" class="error"></div>
<p class="muted">Admin thử nghiệm: <b>admin</b> / <b>admin123</b><br>Nhân viên: <b>nv01</b> / <b>123456</b></p>
</section>

<section id="app" class="hidden">
<div class="card"><div class="row"><div><b id="hello"></b><div id="role" class="muted"></div></div><button class="light" onclick="logout()">Đăng xuất</button></div></div>
<div class="card"><div class="row"><button class="light" onclick="week(-1)">← Tuần trước</button><b id="weekLabel"></b><button class="light" onclick="week(1)">Tuần sau →</button></div></div>

<div class="card">
<h2>📋 Lịch T2 → CN</h2><p class="muted">C1: 07:00–12:00 · C2: 12:00–17:00 · C3: 17:00–23:00</p>
<div class="table"><table><thead><tr><th>Ca</th><th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>CN</th></tr></thead><tbody id="schedule"></tbody></table></div>
</div>

<div id="admin" class="card hidden">
<h2>👨‍💼 Admin</h2>
<div class="grid">
<div><h3>➕ Thêm nhân viên</h3>
<input id="name" placeholder="Họ tên"><input id="user" placeholder="Tài khoản"><input id="pass" placeholder="Mật khẩu">
<button class="primary" onclick="addEmp()">Thêm</button><div id="addmsg" class="muted"></div></div>
<div><h3>👥 Nhân viên</h3><div id="emps"></div></div>
</div>
</div>

<div id="requests" class="card hidden"><h2>📝 Chờ duyệt</h2><div id="reqs"></div></div>
</section>
</main>

<script>
const shifts=[["C1","07:00","12:00"],["C2","12:00","17:00"],["C3","17:00","23:00"]];
const days=["T2","T3","T4","T5","T6","T7","CN"];
let emps=JSON.parse(localStorage.getItem("emps")||"null")||[
{id:"admin",name:"Quản trị viên",user:"admin",pass:"admin123",role:"admin"},
{id:"nv01",name:"Nhân viên 01",user:"nv01",pass:"123456",role:"employee"}];
let regs=JSON.parse(localStorage.getItem("regs")||"[]"),me=null,off=0;
const save=()=>{localStorage.setItem("emps",JSON.stringify(emps));localStorage.setItem("regs",JSON.stringify(regs))};
const pad=n=>String(n).padStart(2,"0");
function monday(){let d=new Date();d.setHours(0,0,0,0);let x=d.getDay();d.setDate(d.getDate()+(x===0?-6:1-x)+off*7);return d}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function login(){
  const username=document.getElementById("u").value.trim();
  const password=document.getElementById("p").value;
  const message=document.getElementById("err");
  const found=emps.find(e=>e.user===username && e.pass===password);
  if(!found){message.textContent="Sai tài khoản hoặc mật khẩu.";return}
  me=found;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("hello").textContent="👋 "+found.name;
  document.getElementById("role").textContent=found.role==="admin"?"Quyền: ADMIN":"Quyền: NHÂN VIÊN";
  if(found.role==="admin"){
    document.getElementById("admin").classList.remove("hidden");
    document.getElementById("requests").classList.remove("hidden");
  }
  render();
}
function logout(){location.reload()}
function week(n){off+=n;render()}
function render(){let m=monday(),s=new Date(m);s.setDate(s.getDate()+6);document.getElementById("weekLabel").textContent=pad(m.getDate())+"/"+pad(m.getMonth()+1)+" - "+pad(s.getDate())+"/"+pad(s.getMonth()+1);let out="";
shifts.forEach(sh=>{out+="<tr><th>"+sh[0]+"<br><span class='muted'>"+sh[1]+"-"+sh[2]+"</span></th>";for(let i=0;i<7;i++){let d=new Date(m);d.setDate(d.getDate()+i);let r=regs.find(r=>r.date===key(d)&&r.shift===sh[0]);let h="<b>"+sh[0]+"</b><div class='time'>"+sh[1]+" - "+sh[2]+"</div>";
if(r){let e=emps.find(e=>e.id===r.emp),mine=r.emp===me.id,cl=r.status==="approved"?"ok":mine?"mine":"";h+="<div>"+(e?e.name:"Nhân viên")+"</div><span class='badge "+(r.status==="approved"?"approved":r.status==="rejected"?"rejected":"pending")+"'>"+(r.status==="approved"?"Đã duyệt":r.status==="rejected"?"Từ chối":"Chờ duyệt")+"</span>";if(mine&&r.status!=="approved")h+="<button class='red' onclick="cancel('"+r.id+"')">Hủy</button>";out+="<td><div class='shift "+cl+"'>"+h+"</div></td>";
}else{h+="<button class='primary' onclick="reg('"+key(d)+"','"+sh[0]+"')">📝 Đăng ký</button>";out+="<td><div class='shift free'>"+h+"</div></td>"}}out+="</tr>"});schedule.innerHTML=out;if(me.role==="admin"){renderReq();renderEmp()}}
function reg(date,shift){if(regs.some(r=>r.date===date&&r.shift===shift&&r.status!=="rejected"))return alert("Ca này đã có người đăng ký.");if(regs.some(r=>r.date===date&&r.emp===me.id&&r.status!=="rejected"))return alert("Bạn đã có ca khác trong ngày này.");regs.push({id:String(Date.now()),date,shift,emp:me.id,status:"pending"});save();render();alert("Đăng ký thành công, chờ Admin duyệt.")}
function cancel(id){if(confirm("Hủy đăng ký?")){regs=regs.filter(r=>r.id!==id);save();render()}}
function renderReq(){let a=regs.filter(r=>r.status==="pending");reqs.innerHTML=a.length?a.map(r=>{let e=emps.find(e=>e.id===r.emp),sh=shifts.find(s=>s[0]===r.shift);return "<div class='item'><b>👤 "+(e?e.name:"")+"</b><br>📅 "+r.date+" · "+sh[0]+" "+sh[1]+"-"+sh[2]+"<br><br><button class='green' onclick="approve('"+r.id+"')">✅ Duyệt</button> <button class='red' onclick="reject('"+r.id+"')">❌ Từ chối</button></div>"}).join(""):"<p class='muted'>Không có đăng ký chờ duyệt.</p>"}
function approve(id){let r=regs.find(x=>x.id===id);if(regs.some(x=>x.id!==id&&x.date===r.date&&x.shift===r.shift&&x.status==="approved"))return alert("Ca này đã được duyệt.");r.status="approved";save();render()}
function reject(id){let r=regs.find(x=>x.id===id);if(r)r.status="rejected";save();render()}
function renderEmp(){emps.innerHTML=emps.map(e=>"<div class='item'><b>"+e.name+"</b><br><span class='muted'>"+e.user+" · "+(e.role==="admin"?"Admin":"Nhân viên")+"</span></div>").join("")}
function addEmp(){
  const n=document.getElementById("name").value.trim();
  const u1=document.getElementById("user").value.trim();
  const p1=document.getElementById("pass").value;
  const msg=document.getElementById("addmsg");
  if(!n||!u1||!p1){msg.textContent="Nhập đủ thông tin.";return}
  if(emps.some(e=>e.user===u1)){msg.textContent="Tài khoản đã tồn tại.";return}
  emps.push({id:"nv"+Date.now(),name:n,user:u1,pass:p1,role:"employee"});
  save();
  document.getElementById("name").value="";
  document.getElementById("user").value="";
  document.getElementById("pass").value="";
  msg.textContent="Đã thêm nhân viên.";
  render();
}
</script>
</body></html>
